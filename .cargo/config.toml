[env]
# Download the prebuilt libduckdb instead of compiling DuckDB's C++ from source.
# Ignored when building with --features bundled.
DUCKDB_DOWNLOAD_LIB = "1"

# The prebuilt libduckdb is copied into target/<profile>/deps. Give binaries an rpath
# to it so they run outside `cargo run`/`cargo test` too (cmux panes, the daemon, a shell):
# target/<profile>/tome looks in deps/, test binaries already live in deps/.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path/deps", "-C", "link-arg=-Wl,-rpath,@executable_path"]

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/deps", "-C", "link-arg=-Wl,-rpath,$ORIGIN"]
