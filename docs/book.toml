[book]
title = "tome"
description = "Docs for tome: repeatable agentic workflows, triggered by file changes, schedules and messages"
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
site-url = "/tome/"
git-repository-url = "https://github.com/banyango/tome"
edit-url-template = "https://github.com/banyango/tome/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/tome.css"]
additional-js = ["theme/tome.js"]
